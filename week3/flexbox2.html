<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 2</title>
    <link rel="stylesheet" href="css/flexbox2-css.css">
</head>

<body>
    <div class="bigger-container">
        <div class="container">
            <div class="logo">
                <img src="images/Icon.png" alt="Icon" width="36px" height="36px"> Postivus
            </div>
            <div class="top-info">
                <div class="info">About Us</div>
                <div class="info">Services</div>
                <div class="info">Use Cases</div>
                <div class="info">Pricing</div>
                <div class="info">Blog</div>
                <button class="request-button">Request a quote</button>
            </div>
        </div>

        <div class="hero-container">
            <div class="hero-info">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.</p>
                <button class="hero-button">Book a consultation</button>
            </div>
            <div class="hero-img"></div>
        </div>
        <div class="companies-container">
            <img src="images/amazon.png">
            <img src="images/dripple.png">
            <img src="images/hubspace.png">
            <img src="images/notion.png">
            <img src="images/netlifx.png">
            <img src="images/zoom.png">
        </div>
    </div>
</body>

</html>
