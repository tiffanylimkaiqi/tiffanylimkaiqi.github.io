<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <link rel="stylesheet" href="css/menu.css">

</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="images/elementra_logo.png" alt="Elementra logo">
        </div>

        <div class="navi">
            <div>Home</div>
            <div class="active">Services</div>
            <div>Work</div>
            <div>Project Details</div>
            <div>Contact</div>
        </div>

        <div class="navi-call">
            <div class="call">
                <img src="images/phone-call.png" alt="call">
                555-123-4567
            </div>
            <button class="btn-contact">Contact</button>
            <img class="hamburger" src="images/burger-menu.svg" alt="Menu">
        </div>
    </div>
</body>

</html>
